<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotion Paint - Floating Icons</title>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #f8f8f8;
      color: #333;
      overflow: hidden;
      height: 100vh;
    }

    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: transparent;
      height: 44px;
      z-index: 1000;
    }

    #header h1 {
      display: none;
    }

    .badge {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-controller {
      background: #FF3ED4;
      color: #fff;
      border-radius: 8px;
    }

    .badge-viewer {
      background: #fff;
      border: 1px solid #FF3ED4;
      color: #FF3ED4;
    }

    /* Top right action buttons */
    #top-actions {
      position: fixed;
      top: 10px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1001;
    }

    #reset-btn {
      padding: 14px 40px;
      border: 2px solid #FF3ED4;
      border-radius: 12px;
      background: #fff;
      color: #FF3ED4;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    #reset-btn:hover {
      background: #fff5fa;
    }

    #save-btn {
      padding: 14px 40px;
      min-width: 250px;
      border: 2px solid #FF3ED4;
      border-radius: 12px;
      background: #FF3ED4;
      color: #fff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 62, 212, 0.4);
      transition: all 0.2s;
      text-align: center;
    }

    /* Top right button shared style (based on original #reset-btn) */
    .top-action-btn {
      padding: 14px 40px;
      min-width: 240px;
      /* Equalize width */
      border: 2px solid #FF3ED4;
      border-radius: 12px;
      background: #fff;
      color: #FF3ED4;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .top-action-btn:hover {
      background: #fff5fa;
    }

    /* Remove individual restart-btn/reset-btn definitions if they conflict or just override by not using them */


    /* Bottom right actions */
    #bottom-right-actions {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 1001;
    }

    #save-btn:hover {
      background: #e835bf;
    }

    #controller-ui {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      padding-top: 44px;
    }

    #canvas-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 480px;
      height: 480px;
    }

    #paint-canvas {
      display: block;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      cursor: crosshair;
      touch-action: none;
    }

    #canvas-toolbar {
      /* スライダーのコンテナ - レイアウトに影響しない */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #canvas-toolbar>* {
      pointer-events: auto;
    }

    /* Mode buttons at bottom left */
    #mode-buttons {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      z-index: 50;
    }

    .mode-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      color: #888;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn:hover {
      border-color: #00838f;
      color: #00838f;
    }

    .mode-btn.active {
      background: #e0f7fa;
      color: #00838f;
      border-color: #00838f;
    }

    /* ── Selection Overlays ── */
    .selection-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      opacity: 1;
      transition: opacity 0.5s ease-out;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .selection-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .selection-overlay .step-heading {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 48px;
      text-align: center;
    }

    /* Vase Selection */
    #vase-select-overlay .vase-choices {
      display: flex;
      gap: 48px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #vase-select-overlay .vase-choice {
      cursor: pointer;
      padding: 24px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #vase-select-overlay .vase-choice:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    #vase-select-overlay .vase-choice img {
      width: 200px;
      height: 300px;
      object-fit: contain;
    }

    /* Background Selection */
    #bg-select-overlay .bg-choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1000px;
    }

    #bg-select-overlay .bg-choice {
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bg-select-overlay .bg-choice:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    #bg-select-overlay .bg-choice img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #bg-select-overlay .bg-choice.blank {
      border: 2px dashed #ccc;
      background: #fff;
    }

    #bg-select-overlay .bg-choice.blank span {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #666;
    }

    #floating-icons {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 5;
    }

    .floating-icon {
      position: absolute;
      width: 90px;
      height: 90px;
      cursor: pointer;
      pointer-events: auto;
      transition: filter 0.15s;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
    }

    .floating-icon:hover {
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25));
      z-index: 100;
    }

    .floating-icon.selected {
      filter: drop-shadow(0 0 20px var(--icon-color));
      z-index: 101;
    }

    .floating-icon svg {
      width: 100%;
      height: 100%;
    }

    .floating-icon .icon-circle {
      transition: stroke-width 0.15s;
    }

    .floating-icon.selected .icon-circle {
      stroke: white;
      stroke-width: 4;
    }

    .floating-icon .icon-text {
      transition: transform 0.1s;
    }

    .floating-icon.clicked .icon-text {
      animation: textShake 0.3s ease-out;
    }

    @keyframes textShake {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(-2px, 0) scale(1.1);
      }

      50% {
        transform: translate(2px, 0) scale(1.15);
      }

      75% {
        transform: translate(-1px, 0) scale(1.05);
      }
    }

    /* Ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: var(--ripple-color, rgba(255, 255, 255, 0.6));
      pointer-events: none;
      animation: rippleExpand 0.6s ease-out forwards;
    }

    @keyframes rippleExpand {
      0% {
        transform: scale(0);
        opacity: 1;
      }

      100% {
        transform: scale(3);
        opacity: 0;
      }
    }

    #effect-slider-overlay {
      display: none;
      position: absolute;
      top: 100%;
      margin-top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 2px solid var(--slider-color, #FF3ED4);
      border-radius: 12px;
      padding: 16px 24px;
      min-width: 280px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      z-index: 60;
    }

    #effect-slider-overlay.visible {
      display: block;
    }

    #effect-slider-overlay .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #effect-slider-overlay .slider-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--slider-color, #FF3ED4);
    }

    #effect-slider-overlay .slider-value {
      font-size: 14px;
      color: #888;
    }

    #effect-slider-overlay input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: #e0e0e0;
      border-radius: 3px;
      outline: none;
    }

    #effect-slider-overlay input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--slider-color, #FF3ED4);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }


    #viewer-ui {
      display: none;
      width: 100vw;
      height: 100vh;
      padding-top: 44px;
      background: #1a1a1a;
      transition: background 0.5s;
    }

    #viewer-ui.light-mode {
      background: #f0f0f0;
    }

    #viewer-ui canvas {
      display: block;
    }

    /* Theme toggle button */
    #theme-toggle {
      position: fixed;
      top: 54px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 11px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #theme-toggle:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    #viewer-ui.light-mode #theme-toggle {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    #viewer-ui.light-mode #theme-toggle:hover {
      background: rgba(255, 255, 255, 1);
    }

    .theme-icon {
      font-size: 14px;
      line-height: 1;
    }

    /* ── Firing Overlay (Viewer) ── */
    #firing-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    #firing-overlay.active {
      display: flex;
      flex-direction: column;
    }

    #firing-overlay .firing-text {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 40px #ff4400, 0 0 80px #ff2200;
      animation: firingPulse 1s ease-in-out infinite alternate;
    }

    @keyframes firingPulse {
      0% {
        text-shadow: 0 0 20px #ff4400, 0 0 40px #ff2200;
        opacity: 0.8;
      }

      100% {
        text-shadow: 0 0 60px #ff6600, 0 0 120px #ff4400;
        opacity: 1;
      }
    }

    #firing-overlay .firing-sub {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 16px;
    }

    /* ── Save Progress (Controller) ── */
    #save-progress-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }

    #save-progress-overlay.active {
      display: flex;
    }

    #save-progress-overlay .progress-box {
      background: #fff;
      border-radius: 24px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
    }

    .progress-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #eee;
      border-top: 4px solid #FF3ED4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── QR Code Popup ── */
    #qr-popup {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    #qr-popup.active {
      display: flex;
    }

    #qr-popup .qr-box {
      background: #fff;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 90%;
    }

    #qr-popup .qr-title {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    #qr-popup .qr-sub {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    #qr-popup #qr-canvas-container {
      margin: 0 auto 24px;
    }

    #qr-popup .qr-close-btn {
      padding: 12px 40px;
      border: 2px solid #FF3ED4;
      border-radius: 12px;
      background: #FF3ED4;
      color: #fff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }


    /* ── Sign Overlay (Controller) ── */
    #sign-overlay {
      position: fixed;
      inset: 0;
      z-index: 3500;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    #sign-overlay.active {
      display: flex;
    }

    #sign-overlay .sign-box {
      background: #fff;
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 90%;
    }

    #sign-overlay .sign-title {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
    }

    #sign-canvas {
      width: 100%;
      aspect-ratio: 3/1;
      border: 2px solid #ddd;
      border-radius: 12px;
      cursor: crosshair;
      touch-action: none;
      background: #fafafa;
    }

    #sign-overlay .sign-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: center;
    }

    #sign-overlay .sign-btn {
      padding: 10px 28px;
      border-radius: 10px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .sign-btn-clear {
      background: #eee;
      color: #666;
    }

    .sign-btn-done {
      background: #FF3ED4;
      color: #fff;
    }

    /* ── Share Page (replaces gallery) ── */
    #ar-viewer-ui {
      display: none;
      width: 100vw;
      min-height: 100vh;
      background: #fafafa;
      flex-direction: column;
      align-items: center;
    }

    .share-page {
      max-width: 480px;
      width: 100%;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .share-header {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #262626;
      text-align: center;
      padding: 16px 0;
    }

    .share-preview {
      width: 100%;
      aspect-ratio: 1;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .share-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .share-emotion {
      width: 100%;
      padding: 12px 0;
    }

    .share-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .share-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .share-btn:active {
      opacity: 0.8;
    }

    .share-btn.instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
    }

    .share-btn.download {
      background: #262626;
      color: #fff;
    }

    .share-message {
      font-size: 14px;
      color: #8e8e8e;
      text-align: center;
      min-height: 20px;
    }

    /* ── Emotion Bar (shared) ── */
    .emotion-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
      background: #eee;
    }

    .emotion-bar-segment {
      height: 100%;
      transition: width 0.4s ease;
    }

    .emotion-label-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    .emotion-label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: #555;
    }

    .emotion-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── QR Popup emotion section ── */
    .qr-emotion-section {
      margin: 16px 0 20px;
      text-align: left;
    }

    .qr-emotion-title {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      text-align: center;
    }

    /* ── Mobile Gallery emotion ── */
    .ig-emotion-summary {
      padding: 0 16px 12px;
      border-bottom: 1px solid #dbdbdb;
    }

    .ig-emotion-summary .emotion-bar {
      height: 10px;
      border-radius: 5px;
    }

    .ig-featured-emotion {
      padding: 8px 16px 12px;
    }

    .ig-grid-item.has-emotion {
      border-bottom: 4px solid var(--emotion-color, transparent);
    }

    .ig-detail-emotion {
      padding: 8px 16px 4px;
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <!-- QR Code Library (browser-compatible) -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
</head>

<body>

  <div id="header">
    <h1>// FLOATING_EMOTION</h1>

  </div>

  <div id="controller-ui">
    <!-- Step 1: Vase Selection Overlay -->
    <div id="vase-select-overlay" class="selection-overlay">
      <h2 class="step-heading">1.<ruby>壺<rt>つぼ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。</h2>
      <div class="vase-choices">
        <div class="vase-choice" data-vase="vaseA">
          <img src="/VASE/vae01.png" alt="壺A">
        </div>
        <div class="vase-choice" data-vase="vaseB">
          <img src="/VASE/vase02.png" alt="壺B">
        </div>
      </div>
    </div>

    <!-- Step 2: Background Selection Overlay -->
    <div id="bg-select-overlay" class="selection-overlay hidden">
      <h2 class="step-heading">2.<ruby>好<rt>す</rt></ruby>きな<ruby>絵<rt>え</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。
      </h2>
      <div class="bg-choices">
        <div class="bg-choice" data-bg="background01.png">
          <img src="/backgrounds/background01.png" alt="背景1">
        </div>
        <div class="bg-choice" data-bg="background02  .png">
          <img src="/backgrounds/background02  .png" alt="背景2">
        </div>
        <div class="bg-choice" data-bg="background03.png">
          <img src="/backgrounds/background03.png" alt="背景3">

    // ══════════════════════════════════════════════════════════════
    const EMOTION_META = {
      joy: { label: '楽しい', icon: '🌟', hex: '#FFD700' },
      shock: { label: '驚き', icon: '⚡', hex: '#FF8C00' },
      sad: { label: '切ない', icon: '💧', hex: '#4682B4' },
      confuse: { label: '混乱', icon: '🌀', hex: '#9370DB' },
      fire: { label: '刺激的', icon: '🔥', hex: '#FF4500' }
    };

    // effectValues → emotion percentages { joy: 0.4, shock: 0.2, ... }
    function calcEmotionFromEffects(effectValues) {
      const emotionTotals = { joy: 0, shock: 0, sad: 0, confuse: 0, fire: 0 };
      if (!effectValues) return emotionTotals;
      TOOLS.filter(t => t.type === 'effect').forEach(t => {
        const val = effectValues[t.id] || 0;
        emotionTotals[t.emotion] += val;
      });
      const sum = Object.values(emotionTotals).reduce((a, b) => a + b, 0);
      if (sum === 0) {
        // equal distribution if nothing was used
        Object.keys(emotionTotals).forEach(k => emotionTotals[k] = 0.2);
      } else {
        Object.keys(emotionTotals).forEach(k => emotionTotals[k] /= sum);
      }
      return emotionTotals;
    }

    // Get dominant emotion from effectValues
    function getDominantEmotion(effectValues) {
      const emotions = calcEmotionFromEffects(effectValues);
      let max = 0, dominant = 'joy';
      Object.entries(emotions).forEach(([k, v]) => {
        if (v > max) { max = v; dominant = k; }
      });
      return dominant;
    }

    // Render emotion bar + labels into containers
    function renderEmotionBar(barEl, labelsEl, emotionPercentages) {
      barEl.innerHTML = '';
      labelsEl.innerHTML = '';
      Object.entries(emotionPercentages).forEach(([emotion, pct]) => {
        if (pct <= 0) return;
        const seg = document.createElement('div');
        seg.className = 'emotion-bar-segment';
        seg.style.width = (pct * 100) + '%';
        seg.style.background = EMOTION_META[emotion].hex;
        barEl.appendChild(seg);

        const label = document.createElement('span');
        label.className = 'emotion-label';
        label.innerHTML = `<span class="emotion-dot" style="background:${EMOTION_META[emotion].hex}"></span>${EMOTION_META[emotion].icon} ${Math.round(pct * 100)}%`;
        labelsEl.appendChild(label);
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  CONTROLLER

    if (role === 'controller') {
      document.getElementById('controller-ui').style.display = 'block';

      const canvas = document.getElementById('paint-canvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, TEX_W, TEX_H);

      let currentTool = TOOLS[0];
      let currentMode = 'bump'; // Default to Bump/Normal
      let currentVaseShape = null; // Set by overlay selection
      let selectedBackground = null; // Selected background file (null = blank)
      let drawing = false, lastX = 0, lastY = 0;

      const effectValues = {};
      TOOLS.filter(t => t.type === 'effect').forEach(t => effectValues[t.id] = 0);

      // Canvas bounds for icon avoidance
      const canvasRect = { x: 0, y: 0, w: 480, h: 480, padding: 60 };

      function updateCanvasRect() {
        const container = document.getElementById('canvas-container');
        const rect = container.getBoundingClientRect();
        canvasRect.x = rect.left - canvasRect.padding;
        canvasRect.y = rect.top - canvasRect.padding;
        canvasRect.w = rect.width + canvasRect.padding * 2;
        canvasRect.h = rect.height + canvasRect.padding * 2;
      }
      setTimeout(updateCanvasRect, 100);
      window.addEventListener('resize', updateCanvasRect);

      // ══════════════════════════════════════
      //  Selection Flow: Vase -> Background -> Main UI
      // ══════════════════════════════════════
      const vaseOverlay = document.getElementById('vase-select-overlay');
      const bgOverlay = document.getElementById('bg-select-overlay');

      // Step 1: Vase Selection
      document.querySelectorAll('.vase-choice').forEach(choice => {
        choice.addEventListener('click', () => {
          const shape = choice.dataset.vase;
          currentVaseShape = shape;

          // Update toolbar button state
          document.querySelectorAll('.vase-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.vase === shape);
          });

          // Emit to viewer
          socket.emit('vaseShape', currentVaseShape);

          // Transition to background selection
          vaseOverlay.classList.add('hidden');
          setTimeout(() => {
            vaseOverlay.style.display = 'none';
            bgOverlay.classList.remove('hidden');
          }, 500);
        });
      });

      // Step 2: Background Selection
      document.querySelectorAll('.bg-choice').forEach(choice => {
        choice.addEventListener('click', () => {
          const bgFile = choice.dataset.bg;

          // Store selected background
          selectedBackground = (bgFile === 'blank') ? null : bgFile;

          if (bgFile === 'blank') {
            // White canvas
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, TEX_W, TEX_H);
            sendCanvas();
          } else {
            // Load background image to canvas
            const bgImg = new Image();
            bgImg.onload = () => {
              ctx.drawImage(bgImg, 0, 0, TEX_W, TEX_H);
              sendCanvas();
            };
            bgImg.src = '/backgrounds/' + bgFile;
          }

          // Dismiss background overlay and show main UI
          bgOverlay.classList.add('hidden');
          setTimeout(() => bgOverlay.style.display = 'none', 500);
        });
      });

      // 3D Mode Buttons (now in #mode-buttons container)
      document.querySelectorAll('#mode-buttons .mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentMode = btn.dataset.mode;
          document.querySelectorAll('#mode-buttons .mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          sendCanvas();
        });
      });

      // Start Over button (Restart)
      // Change Vase button (Reload)
      document.getElementById('change-vase-btn').addEventListener('click', () => {
        if (confirm('「つぼ」をかえますか？（これまでの作業は失われます）')) {
          location.reload();
        }

      // Change Picture button (Back to Background Select)
      document.getElementById('change-bg-btn').addEventListener('click', () => {
        if (confirm('「え」をかえますか？（かいた絵は消えます）')) {
