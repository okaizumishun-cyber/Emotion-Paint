      // ══════════════════════════════════════
      //  Floating Icons with Physics
      // ══════════════════════════════════════
      const floatingContainer = document.getElementById('floating-icons');
      const iconElements = [];
      const iconStates = [];

      function createFloatingIcon(tool, index) {
        const div = document.createElement('div');
        div.className = 'floating-icon';
        div.dataset.toolId = tool.id;
        div.style.setProperty('--icon-color', tool.color);

        div.innerHTML = `
      <svg viewBox="0 0 100 100">
        <circle class="icon-circle" cx="50" cy="50" r="45" fill="${tool.color}" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
        <text class="icon-text" x="50" y="58" font-size="16" text-anchor="middle" fill="white" font-weight="bold" style="font-family: 'M PLUS Rounded 1c', sans-serif;">${tool.text}</text>
      </svg>
    `;

        // Initial position (will be updated by animation)
        const state = {
          scale: 1,
          targetScale: 1
        };
        iconStates.push(state);

        div.addEventListener('click', (e) => {
          // Ripple effect
          const ripple = document.createElement('div');
          ripple.className = 'ripple';
          ripple.style.setProperty('--ripple-color', tool.color + '80');
          ripple.style.width = '70px';
          ripple.style.height = '70px';
          ripple.style.left = '0';
          ripple.style.top = '0';
          div.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);

          // Text shake
          div.classList.add('clicked');
          setTimeout(() => div.classList.remove('clicked'), 300);

          selectTool(tool, div, index);
        });

        floatingContainer.appendChild(div);
        iconElements.push(div);
        return div;
      }

      TOOLS.forEach((tool, i) => createFloatingIcon(tool, i));
      selectTool(TOOLS[0], iconElements[0], 0);

      function selectTool(tool, element, index) {
        currentTool = tool;

        iconElements.forEach((el, i) => {
          el.classList.remove('selected');
          iconStates[i].targetScale = 1;
        });
        element.classList.add('selected');
        iconStates[index].targetScale = 1.2;

        const overlay = document.getElementById('effect-slider-overlay');
        if (tool.type === 'effect') {
          overlay.style.setProperty('--slider-color', tool.color);
          document.getElementById('slider-effect-name').textContent = tool.text;
          document.getElementById('effect-range').value = effectValues[tool.id] * 100;
          document.getElementById('slider-value-display').textContent = Math.round(effectValues[tool.id] * 100) + '%';
          overlay.classList.add('visible');
        } else {
          overlay.classList.remove('visible');
        }

        const specialPens = ['lava', 'mosh', 'warp', 'fade'];
        canvas.style.cursor = specialPens.includes(tool.id) ? 'grab' : 'crosshair';
      }

      document.getElementById('effect-range').addEventListener('input', (e) => {
        const val = e.target.value / 100;
        effectValues[currentTool.id] = val;
        document.getElementById('slider-value-display').textContent = Math.round(val * 100) + '%';
        emitEffects();
      });

      function emitEffects() {
        socket.emit('emotion', effectValues);
      }

      function clearAll() {
        // Reset effects
        TOOLS.filter(t => t.type === 'effect').forEach(t => effectValues[t.id] = 0);
        if (currentTool.type === 'effect') {
          document.getElementById('effect-range').value = 0;
          document.getElementById('slider-value-display').textContent = '0%';
        }
        emitEffects();

        // Restore to selected background
        if (selectedBackground) {
          const bgImg = new Image();
          bgImg.onload = () => {
            ctx.drawImage(bgImg, 0, 0, TEX_W, TEX_H);
            sendCanvas();
          };
          bgImg.src = '/backgrounds/' + selectedBackground;
        } else {
          // White canvas (blank was selected)
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, TEX_W, TEX_H);
          sendCanvas();
        }
      }

      // ══════════════════════════════════════
      //  操作UI 角丸長方形軌道アニメーション
      // ══════════════════════════════════════
      const ORBIT_SPEED = 0.00002// 進捗(0.0~1.0)/ミリ秒
      const ICON_SIZE = 90;
      const CANVAS_SIZE = 480;
      const ICON_MARGIN = 30; // アイコンとキャンバス間のマージン

      // 軌道パラメータ
      let orbitPath = { cx: 0, cy: 0, segments: [], totalLength: 0 };
      let orbitStartTime = null;

      function calculateOrbitParams() {
        const w = window.innerWidth;
        const h = window.innerHeight;

        // 画面端からのマージン (アイコン半径 + 余白40x)
        // これにより最大サイズで画面いっぱいに広がる
        const edgeMargin = ICON_SIZE + 30 / 2 + 10;

        const pathW = w - edgeMargin * 2 - 200;
        const pathH = h - edgeMargin * 2;

        // 角丸の半径 (短辺の20%程度)
        const r = Math.min(pathW, pathH) * 0.2;

        // 軌道中心
        const cx = w / 2;
        const cy = h / 2 - 50

        // セグメント定義 (上辺から時計回り)
        const straightW = pathW - 2 * r;
        const straightH = pathH - 2 * r;
        const arcLen = 0.5 * Math.PI * r;

        // 各セグメント: type, length, および計算に必要なパラメータ
        const segments = [
          // Top Line (Left to Right)
          { type: 'line', len: straightW, startX: -straightW / 2, startY: -pathH / 2, dx: 1, dy: 0 },
          // Top-Right Arc
          { type: 'arc', len: arcLen, cx: straightW / 2, cy: -straightH / 2, startAngle: -Math.PI / 2, endAngle: 0, r: r },
          // Right Line (Top to Bottom)
          { type: 'line', len: straightH, startX: pathW / 2, startY: -straightH / 2, dx: 0, dy: 1 },
          // Bottom-Right Arc
          { type: 'arc', len: arcLen, cx: straightW / 2, cy: straightH / 2, startAngle: 0, endAngle: Math.PI / 2, r: r },
          // Bottom Line (Right to Left)
          { type: 'line', len: straightW, startX: straightW / 2, startY: pathH / 2, dx: -1, dy: 0 },
          // Bottom-Left Arc
          { type: 'arc', len: arcLen, cx: -straightW / 2, cy: straightH / 2, startAngle: Math.PI / 2, endAngle: Math.PI, r: r },
          // Left Line (Bottom to Top)
          { type: 'line', len: straightH, startX: -pathW / 2, startY: straightH / 2, dx: 0, dy: -1 },
          // Top-Left Arc
          { type: 'arc', len: arcLen, cx: -straightW / 2, cy: -straightH / 2, startAngle: Math.PI, endAngle: Math.PI * 1.5, r: r }
        ];

        let currentDist = 0;
        segments.forEach(seg => {
          seg.startDist = currentDist;
          currentDist += seg.len;
        });

        orbitPath = { cx, cy, segments, totalLength: currentDist };
      }

      function getPositionOnOrbit(progress) {
        // 正規化された進捗 (0.0 ~ 1.0) を距離に変換
        let d = (progress % 1.0);
        if (d < 0) d += 1.0;
        d *= orbitPath.totalLength;

        // 該当するセグメントを探す
        // (線形探索だがセグメント数8個なので十分高速)
        for (const seg of orbitPath.segments) {
          if (d >= seg.startDist && d < seg.startDist + seg.len) {
            const localD = d - seg.startDist;

            if (seg.type === 'line') {
              return {
                x: orbitPath.cx + seg.startX + seg.dx * localD,
                y: orbitPath.cy + seg.startY + seg.dy * localD
              };
            } else {
              const p = localD / seg.len; // 0.0 ~ 1.0 inside arc
              const angle = seg.startAngle + (seg.endAngle - seg.startAngle) * p;
              return {
                x: orbitPath.cx + seg.cx + Math.cos(angle) * seg.r,
                y: orbitPath.cy + seg.cy + Math.sin(angle) * seg.r
              };
            }
          }
        }
        // Fallback (for precision issues at exactly 1.0)
        return { x: orbitPath.cx, y: orbitPath.cy - orbitPath.segments[0].startY };
      }

      // 初期化
      calculateOrbitParams();

      function animateIcons(timestamp) {
        if (orbitStartTime === null) {
          orbitStartTime = timestamp;
        }

        const elapsed = timestamp - orbitStartTime;
        const globalProgress = elapsed * ORBIT_SPEED;

        const iconCount = iconElements.length;

        iconElements.forEach((el, i) => {
          const state = iconStates[i];

          // 各アイコンを等間隔に配置 (周長ベース)
          const progressOffset = i / iconCount;
          const currentProgress = globalProgress + progressOffset;

          const pos = getPositionOnOrbit(currentProgress);

          // スケールアニメーション
          state.scale += (state.targetScale - state.scale) * 0.1;

          el.style.left = (pos.x - ICON_SIZE / 2) + 'px';
          el.style.top = (pos.y - ICON_SIZE / 2) + 'px';
          el.style.transform = `scale(${state.scale})`;
        });

        requestAnimationFrame(animateIcons);
      }
      requestAnimationFrame(animateIcons);

      window.addEventListener('resize', () => {
        updateCanvasRect();
        calculateOrbitParams();
      });

      // ══════════════════════════════════════
      //  Drawing Logic - 15 Pens
      // ══════════════════════════════════════
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return {
          x: (t.clientX - rect.left) * (TEX_W / rect.width),
          y: (t.clientY - rect.top) * (TEX_H / rect.height)
        };
      }

      function getPenColor() { return currentTool.color || '#000'; }

      function drawPop(x, y) {
        const shapes = ['circle', 'star', 'heart'];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const size = 10 + Math.random() * 20;
        ctx.fillStyle = getPenColor();
        ctx.beginPath();
        if (shape === 'circle') {
          ctx.arc(x, y, size, 0, Math.PI * 2);
        } else if (shape === 'star') {
          drawStar(ctx, x, y, 5, size, size * 0.5);
        } else {
          drawHeart(ctx, x, y, size);
        }
        ctx.fill();
      }

      function drawStar(c, cx, cy, spikes, oR, iR) {
        let rot = -Math.PI / 2, step = Math.PI / spikes;
        c.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? oR : iR;
          const a = rot + step * i;
          i === 0 ? c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        }
        c.closePath();
      }

      function drawHeart(c, x, y, size) {
        c.beginPath();
        c.moveTo(x, y + size * 0.3);
        c.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.5);
        c.bezierCurveTo(x - size, y + size, x, y + size * 1.2, x, y + size * 1.5);
        c.bezierCurveTo(x, y + size * 1.2, x + size, y + size, x + size, y + size * 0.5);
        c.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
        c.closePath();
      }

      let rainbowHue = 0;
      function drawRainbow(x0, y0, x1, y1) {
        rainbowHue = (rainbowHue + 5) % 360;
        ctx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }

      const LAVA_RES = 64;
      const lavaVX = new Float32Array(LAVA_RES * LAVA_RES);
      const lavaVY = new Float32Array(LAVA_RES * LAVA_RES);
      let lavaSnapshot = null, lavaActive = false, lavaRAF = 0;

      function lavaAddVel(cx, cy, vx, vy) {
        const scale = LAVA_RES / TEX_W, lcx = cx * scale, lcy = cy * scale;
        const radius = 8, r2 = radius * radius;
        for (let y = Math.max(0, Math.floor(lcy - radius)); y < Math.min(LAVA_RES, Math.ceil(lcy + radius)); y++) {
          for (let x = Math.max(0, Math.floor(lcx - radius)); x < Math.min(LAVA_RES, Math.ceil(lcx + radius)); x++) {
            const dx = x - lcx, dy = y - lcy, d2 = dx * dx + dy * dy;
            if (d2 > r2) continue;
            const f = (1 - Math.sqrt(d2) / radius) * 0.5;
            const i = y * LAVA_RES + x;
            lavaVX[i] += vx * f;
            lavaVY[i] += vy * f;
          }
        }
      }

      function lavaStep() {
        if (!lavaActive && !lavaHasMotion()) { lavaRAF = 0; return; }
        if (lavaSnapshot) {
          const src = lavaSnapshot, dst = ctx.createImageData(TEX_W, TEX_H);
          const scaleInv = TEX_W / LAVA_RES;
          for (let y = 0; y < TEX_H; y++) {
            for (let x = 0; x < TEX_W; x++) {
              const lx = x / scaleInv, ly = y / scaleInv;
              const ix = Math.min(LAVA_RES - 1, Math.floor(lx)), iy = Math.min(LAVA_RES - 1, Math.floor(ly));
              const i = iy * LAVA_RES + ix;
              const uvx = lavaVX[i], uvy = lavaVY[i];
              const sx = Math.max(0, Math.min(TEX_W - 1, Math.round(x - uvx)));
              const sy = Math.max(0, Math.min(TEX_H - 1, Math.round(y - uvy)));
              const si = (sy * TEX_W + sx) * 4, di = (y * TEX_W + x) * 4;
              dst.data[di] = src.data[si]; dst.data[di + 1] = src.data[si + 1];
              dst.data[di + 2] = src.data[si + 2]; dst.data[di + 3] = src.data[si + 3];
            }
          }
          ctx.putImageData(dst, 0, 0);
          lavaSnapshot = ctx.getImageData(0, 0, TEX_W, TEX_H);
        }
        for (let i = 0; i < LAVA_RES * LAVA_RES; i++) { lavaVX[i] *= 0.9; lavaVY[i] *= 0.9; }
        lavaRAF = requestAnimationFrame(lavaStep);
      }

      function lavaHasMotion() {
        for (let i = 0; i < LAVA_RES * LAVA_RES; i++) if (Math.abs(lavaVX[i]) > 0.02 || Math.abs(lavaVY[i]) > 0.02) return true;
        return false;
      }

      function drawGlitch(x, y) {
        const w = 20 + Math.random() * 40, h = 4 + Math.random() * 12;
        const imgData = ctx.getImageData(Math.max(0, x - w / 2), Math.max(0, y - h / 2), w, h);
        ctx.putImageData(imgData, x - w / 2 + (Math.random() - 0.5) * 30, y - h / 2 + (Math.random() - 0.5) * 10);
        ctx.fillStyle = getPenColor();
        ctx.globalAlpha = 0.3;
        ctx.fillRect(x - w / 2, y - h / 2, w, h);
        ctx.globalAlpha = 1;
      }

      function drawLightning(x0, y0, x1, y1) {
        ctx.strokeStyle = getPenColor();
        ctx.lineWidth = 2;
        ctx.shadowColor = getPenColor();
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        const steps = 8;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const tx = x0 + (x1 - x0) * t + (Math.random() - 0.5) * 20;
          const ty = y0 + (y1 - y0) * t + (Math.random() - 0.5) * 20;
          ctx.lineTo(tx, ty);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function drawMosh(cx, cy, vx, vy) {
        const speed = Math.sqrt(vx * vx + vy * vy);
        if (speed < 1) return;
        const radius = 30, r2 = radius * radius;
        const x0 = Math.max(0, Math.floor(cx - radius)), y0 = Math.max(0, Math.floor(cy - radius));
        const x1 = Math.min(TEX_W, Math.ceil(cx + radius)), y1 = Math.min(TEX_H, Math.ceil(cy + radius));
        const w = x1 - x0, h = y1 - y0;
        if (w <= 0 || h <= 0) return;
        const imgData = ctx.getImageData(x0, y0, w, h), src = new Uint8ClampedArray(imgData.data);
        const intensity = Math.min(speed / 10, 1);
        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            const dx = (x0 + px) - cx, dy = (y0 + py) - cy, d2 = dx * dx + dy * dy;
            if (d2 > r2) continue;
            const f = (1 - Math.sqrt(d2) / radius) * intensity;
            const di = (py * w + px) * 4;
            const dispX = Math.round(vx * f * 2), dispY = Math.round(vy * f * 2);
            const sx = Math.max(0, Math.min(w - 1, px - dispX)), sy = Math.max(0, Math.min(h - 1, py - dispY));
            const si = (sy * w + sx) * 4;
            imgData.data[di] = src[si]; imgData.data[di + 1] = src[si + 1]; imgData.data[di + 2] = src[si + 2];
            const shift = Math.round(f * speed * 0.5);
            if (shift > 0) {
              imgData.data[di] = src[(sy * w + Math.max(0, sx - shift)) * 4];
              imgData.data[di + 2] = src[(sy * w + Math.min(w - 1, sx + shift)) * 4 + 2];
            }
          }
        }
        ctx.putImageData(imgData, x0, y0);
      }

      function drawDrip(x, y) {
        ctx.fillStyle = getPenColor();
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        const len = 20 + Math.random() * 40;
        ctx.ellipse(x, y + len / 2, 4, len / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawBlur(x, y) {
        const r = 15;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = getPenColor();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      let fadeSnapshot = null, fadeActive = false;
      function startFade() { fadeSnapshot = ctx.getImageData(0, 0, TEX_W, TEX_H); fadeActive = true; }
      function applyFade(x, y) {
        if (!fadeSnapshot) return;
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      function stopFade() { fadeActive = false; }

      let spiralAngle = 0;
      function drawSpiral(x, y) {
        spiralAngle += 0.3;
        ctx.strokeStyle = getPenColor();
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < 50; i++) {
          const a = spiralAngle + i * 0.2;
          const r = i * 0.8;
          const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      function drawMirror(x0, y0, x1, y1) {
        ctx.strokeStyle = getPenColor();
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(TEX_W - x0, y0); ctx.lineTo(TEX_W - x1, y1); ctx.stroke();
      }

      function drawWarp(cx, cy, vx, vy) {
        const speed = Math.sqrt(vx * vx + vy * vy);
        if (speed < 1) return;
        const radius = 40, r2 = radius * radius;
        const x0 = Math.max(0, Math.floor(cx - radius)), y0 = Math.max(0, Math.floor(cy - radius));
        const x1 = Math.min(TEX_W, Math.ceil(cx + radius)), y1 = Math.min(TEX_H, Math.ceil(cy + radius));
        const w = x1 - x0, h = y1 - y0;
        if (w <= 0 || h <= 0) return;
        const imgData = ctx.getImageData(x0, y0, w, h), src = new Uint8ClampedArray(imgData.data);
        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            const dx = (x0 + px) - cx, dy = (y0 + py) - cy, d2 = dx * dx + dy * dy;
            if (d2 > r2) continue;
            const dist = Math.sqrt(d2), f = 1 - dist / radius;
            const angle = Math.atan2(dy, dx) + f * 0.5;
            const newDist = dist * (1 + f * 0.3);
            const sx = Math.round(cx + Math.cos(angle) * newDist) - x0;
            const sy = Math.round(cy + Math.sin(angle) * newDist) - y0;
            if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
              const di = (py * w + px) * 4, si = (sy * w + sx) * 4;
              imgData.data[di] = src[si]; imgData.data[di + 1] = src[si + 1]; imgData.data[di + 2] = src[si + 2];
            }
          }
        }
        ctx.putImageData(imgData, x0, y0);
      }

      let trailPoints = [];
      function drawTrail(x, y) {
        trailPoints.push({ x, y, age: 0 });
        if (trailPoints.length > 30) trailPoints.shift();
        trailPoints.forEach(p => {
          p.age++;
          const alpha = 1 - p.age / 30;
          if (alpha > 0) {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = getPenColor();
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 * alpha, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        ctx.globalAlpha = 1;
        trailPoints = trailPoints.filter(p => p.age < 30);
      }

      function drawNeon(x0, y0, x1, y1) {
        ctx.strokeStyle = getPenColor();
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.shadowColor = getPenColor();
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function drawShard(x, y) {
        const count = 3 + Math.floor(Math.random() * 4);
        ctx.fillStyle = getPenColor();
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 10 + Math.random() * 30;
          const size = 5 + Math.random() * 10;
          ctx.save();
          ctx.translate(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size * 0.3, size);
          ctx.lineTo(-size * 0.3, size);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function sendCanvas() {
        const shape = currentVaseShape || 'vaseA';
        socket.emit('draw', { dataURL: canvas.toDataURL('image/png'), mode: currentMode, vaseShape: shape });
      }

      function onDown(e) {
        if (currentTool.type !== 'pen') return;
        e.preventDefault();
        const p = getPos(e);
        drawing = true;
        lastX = p.x; lastY = p.y;

        if (currentTool.id === 'lava') {
          lavaSnapshot = ctx.getImageData(0, 0, TEX_W, TEX_H);
          lavaActive = true;
          if (!lavaRAF) lavaRAF = requestAnimationFrame(lavaStep);
          canvas.style.cursor = 'grabbing';
        } else if (currentTool.id === 'fade') {
          startFade();
        } else if (currentTool.id === 'warp' || currentTool.id === 'mosh') {
          canvas.style.cursor = 'grabbing';
        }

        if (['pop', 'glitch', 'drip', 'spiral', 'shard'].includes(currentTool.id)) {
          if (currentTool.id === 'pop') drawPop(p.x, p.y);
          else if (currentTool.id === 'glitch') drawGlitch(p.x, p.y);
          else if (currentTool.id === 'drip') drawDrip(p.x, p.y);
          else if (currentTool.id === 'spiral') drawSpiral(p.x, p.y);
          else if (currentTool.id === 'shard') drawShard(p.x, p.y);
        }
      }

      function onMove(e) {
        if (!drawing || currentTool.type !== 'pen') return;
        e.preventDefault();
        const p = getPos(e);
        const vx = p.x - lastX, vy = p.y - lastY;

        switch (currentTool.id) {
          case 'pop': drawPop(p.x, p.y); break;
          case 'rainbow': drawRainbow(lastX, lastY, p.x, p.y); break;
          case 'lava': lavaAddVel(p.x, p.y, vx, vy); break;
          case 'glitch': drawGlitch(p.x, p.y); break;
          case 'lightning': drawLightning(lastX, lastY, p.x, p.y); break;
          case 'mosh': drawMosh(p.x, p.y, vx, vy); break;
          case 'drip': drawDrip(p.x, p.y); break;
          case 'blur': drawBlur(p.x, p.y); break;
          case 'fade': applyFade(p.x, p.y); break;
          case 'spiral': drawSpiral(p.x, p.y); break;
          case 'mirror': drawMirror(lastX, lastY, p.x, p.y); break;
          case 'warp': drawWarp(p.x, p.y, vx, vy); break;
          case 'trail': drawTrail(p.x, p.y); break;
          case 'neon': drawNeon(lastX, lastY, p.x, p.y); break;
          case 'shard': drawShard(p.x, p.y); break;
        }
        lastX = p.x; lastY = p.y;
      }

      function onUp() {
        if (!drawing) return;
        drawing = false;
        if (currentTool.id === 'lava') { lavaActive = false; canvas.style.cursor = 'grab'; }
        else if (currentTool.id === 'fade') { stopFade(); }
        else if (currentTool.id === 'warp' || currentTool.id === 'mosh') { canvas.style.cursor = 'grab'; }
        sendCanvas();
      }

      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointerleave', onUp);
      canvas.addEventListener('pointercancel', onUp);

      // ══════════════════════════════════════
      //  Save & Firing Sequence (Controller)
      // ══════════════════════════════════════
      let saveTimeout = null;
      let saveCompleted = false;

      // ── Signature Canvas Setup ──
      let pendingSaveData = null;
      let signatureDataUrl = null;

      const signCanvas = document.getElementById('sign-canvas');
      const signCtx = signCanvas.getContext('2d');
      let signDrawing = false;
      let signLastX = 0, signLastY = 0;

      function clearSignCanvas() {
        signCtx.fillStyle = '#fafafa';
        signCtx.fillRect(0, 0, signCanvas.width, signCanvas.height);
      }
      clearSignCanvas();

      signCanvas.addEventListener('pointerdown', (e) => {
        signDrawing = true;
        const rect = signCanvas.getBoundingClientRect();
        const scaleX = signCanvas.width / rect.width;
        const scaleY = signCanvas.height / rect.height;
        signLastX = (e.clientX - rect.left) * scaleX;
        signLastY = (e.clientY - rect.top) * scaleY;
      });
      signCanvas.addEventListener('pointermove', (e) => {
        if (!signDrawing) return;
        const rect = signCanvas.getBoundingClientRect();
        const scaleX = signCanvas.width / rect.width;
        const scaleY = signCanvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        signCtx.strokeStyle = '#333';
        signCtx.lineWidth = 3;
        signCtx.lineCap = 'round';
        signCtx.lineJoin = 'round';
        signCtx.beginPath();
        signCtx.moveTo(signLastX, signLastY);
        signCtx.lineTo(x, y);
        signCtx.stroke();
        signLastX = x;
        signLastY = y;
      });
      signCanvas.addEventListener('pointerup', () => signDrawing = false);
      signCanvas.addEventListener('pointerleave', () => signDrawing = false);

      document.getElementById('sign-clear-btn').addEventListener('click', clearSignCanvas);

      document.getElementById('sign-done-btn').addEventListener('click', () => {
        signatureDataUrl = signCanvas.toDataURL('image/png');
        document.getElementById('sign-overlay').classList.remove('active');

        // Now proceed with the actual save
        proceedWithSave(pendingSaveData, signatureDataUrl);
      });

      function showQrPopup(workId, emotionEffectValues) {
        const qrPopup = document.getElementById('qr-popup');
        const qrContainer = document.getElementById('qr-canvas-container');
        qrContainer.innerHTML = '';

        const workUrl = `${location.origin}?workId=${workId}`;

        if (typeof QRious !== 'undefined') {
          const qrCanvas = document.createElement('canvas');
          qrContainer.appendChild(qrCanvas);
          new QRious({
            element: qrCanvas,
            value: workUrl,
            size: 200,
            level: 'M'
          });
        } else {
          const qrImg = document.createElement('img');
          qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(workUrl)}`;
          qrImg.alt = 'QR Code';
          qrImg.style.width = '200px';
          qrImg.style.height = '200px';
          qrContainer.appendChild(qrImg);
        }

        // Render emotion bar in QR popup
        if (emotionEffectValues) {
          const emotions = calcEmotionFromEffects(emotionEffectValues);
          renderEmotionBar(
            document.getElementById('qr-emotion-bar'),
            document.getElementById('qr-emotion-labels'),
            emotions
          );
          document.getElementById('qr-emotion-section').style.display = 'block';
        }

        qrPopup.classList.add('active');
      }

      function showSaveResult(data) {
        if (saveCompleted) return;
        saveCompleted = true;
        clearTimeout(saveTimeout);

        document.getElementById('save-progress-overlay').classList.remove('active');
        showQrPopup(data.workId, pendingSaveData ? pendingSaveData.effectValues : null);
      }

      function proceedWithSave(saveData, signature) {
        saveCompleted = false;
        const saveOverlay = document.getElementById('save-progress-overlay');
        saveOverlay.classList.add('active');
        document.getElementById('save-status-text').textContent = '焼き上げ中...';

        // Attach signature to saveData
        saveData.signatureData = signature;

        // Send save data to viewer
        socket.emit('save', saveData);

        // Timeout fallback
        saveTimeout = setTimeout(() => {
          if (saveCompleted) return;
          console.warn('Viewer did not respond, saving directly...');

          const workId = 'work_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

          fetch('/api/works/' + workId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              displacementData: saveData.displacementData,
              effectValues: saveData.effectValues,
              vaseShape: saveData.vaseShape,
              mode: saveData.mode,
              thumbnailUrl: saveData.displacementData,
              signatureData: signature
            })
          }).then(() => console.log('Saved to server API:', workId))
            .catch(e => console.error('Server save error:', e));

          if (db && firebaseReady) {
            db.collection(GALLERY_PATH).doc(workId).set({
              displacementData: saveData.displacementData,
              effectValues: saveData.effectValues,
              vaseShape: saveData.vaseShape,
              timestamp: firebase.firestore.FieldValue.serverTimestamp(),
              thumbnailUrl: saveData.displacementData,
              mode: saveData.mode,
              signatureData: signature
            }).catch(e => console.warn('Firestore save error:', e));
          }

          showSaveResult({ workId, thumbnailUrl: saveData.displacementData });
        }, 10000);
      }

      // Save button → Show sign overlay first
      document.getElementById('save-btn').addEventListener('click', () => {
        pendingSaveData = {
          displacementData: canvas.toDataURL('image/png'),
          effectValues: { ...effectValues },
          vaseShape: currentVaseShape || 'vaseA',
          mode: currentMode,
          timestamp: Date.now()
        };

        // Show signature overlay
        clearSignCanvas();
        document.getElementById('sign-overlay').classList.add('active');
      });

      // Receive save completion from viewer
      socket.on('saveComplete', (data) => {
        showSaveResult(data);
      });

      document.getElementById('qr-close-btn').addEventListener('click', () => {
        document.getElementById('qr-popup').classList.remove('active');
      });

      // ══════════════════════════════════════
      //  Idle Timer -> Gallery Mode (30s)
      // ══════════════════════════════════════
      let idleTimer = null;
      const IDLE_TIMEOUT = 30000;

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          socket.emit('enterGallery');
        }, IDLE_TIMEOUT);
      }

      ['pointerdown', 'pointermove', 'keydown', 'click'].forEach(evt => {
        document.addEventListener(evt, () => {
          // If gallery is active, exit it on any input
          socket.emit('exitGallery');
          resetIdleTimer();
        });
      });
      resetIdleTimer();
    }

    // ══════════════════════════════════════════════════════════════
    //  VIEWER
    // ══════════════════════════════════════════════════════════════
    if (role === 'viewer') {
      const container = document.getElementById('viewer-ui');
      container.style.display = 'block';

      // Theme state
      let isDarkMode = localStorage.getItem('viewerTheme') !== 'light';
      const THEME = {
        dark: {
          background: 0x1a1a1a,
          fogBase: { r: 0.1, g: 0.1, b: 0.1 },
          gridMain: 0x333333,
          gridSub: 0x222222,
          ambientBase: 0.4
        },
        light: {
          background: 0xf0f0f0,
          fogBase: { r: 0.9, g: 0.9, b: 0.9 },
          gridMain: 0xcccccc,
          gridSub: 0xdddddd,
          ambientBase: 0.6
        }
      };

      const texCanvas = document.createElement('canvas');
      texCanvas.width = TEX_W; texCanvas.height = TEX_H;
      const texCtx = texCanvas.getContext('2d');
      texCtx.fillStyle = '#fff'; texCtx.fillRect(0, 0, TEX_W, TEX_H);

      const dispCanvas = document.createElement('canvas');
      dispCanvas.width = TEX_W; dispCanvas.height = TEX_H;
      const dispCtx = dispCanvas.getContext('2d');
      dispCtx.fillStyle = '#000'; dispCtx.fillRect(0, 0, TEX_W, TEX_H);

      const normalCanvas = document.createElement('canvas');
      normalCanvas.width = TEX_W; normalCanvas.height = TEX_H;
      const normalCtx = normalCanvas.getContext('2d');
      normalCtx.fillStyle = '#8080ff'; normalCtx.fillRect(0, 0, TEX_W, TEX_H);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(isDarkMode ? THEME.dark.background : THEME.light.background);


      const viewW = window.innerWidth, viewH = window.innerHeight - 44;
      const camera = new THREE.PerspectiveCamera(45, viewW / viewH, 0.1, 100);
      const defaultCamPos = { x: 0, y: 2.5, z: 7 };
      camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);
      camera.lookAt(0, 1.5, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(viewW, viewH);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(4, 6, 4);
      scene.add(dirLight);

      // Dynamic point lights (3 pulsing lights)
      const pointLights = [];
      const lightPositions = [
        { x: 2, y: 2, z: 2 },
        { x: -2, y: 1.5, z: 2 },
        { x: 0, y: 3, z: -2 }
      ];
      lightPositions.forEach((pos, i) => {
        const light = new THREE.PointLight(0xffffff, 0, 8);
        light.position.set(pos.x, pos.y, pos.z);
        scene.add(light);
        pointLights.push({ light, baseIntensity: 0, phase: i * Math.PI * 2 / 3 });
      });

      // ══════════════════════════════════════
      //  Solid Vase Geometry from JSON data
      //  SplineCurve interpolation + wall thickness + closed bottom
      // ══════════════════════════════════════
      const WALL_THICKNESS = 0.12;
      const LATHE_SEGMENTS = 128;
      const SPLINE_SAMPLES = 60;

      function createSolidVaseGeometry(shapeData) {
        // Scale factor: normalize to a nice display height (~3.5 units)
        const maxH = shapeData[shapeData.length - 1].h;
        const scale = 3.5 / maxH;

        // Build SplineCurve from the JSON control points (outer wall)
        const outerControlPts = shapeData.map(p =>
          new THREE.Vector2(p.r * scale, p.h * scale)
        );
        const outerSpline = new THREE.SplineCurve(outerControlPts);
        const outerPts = outerSpline.getPoints(SPLINE_SAMPLES);

        // Inner wall: offset inward by WALL_THICKNESS
        const innerPts = outerPts.map(p => {
          const r = Math.max(0.01, p.x - WALL_THICKNESS);
          return new THREE.Vector2(r, p.y);
        });

        // Build the full profile: outer bottom -> outer top -> inner top -> inner bottom -> close
        const profile = [];

        // Outer bottom center (close the bottom)
        profile.push(new THREE.Vector2(0, outerPts[0].y));

        // Outer wall (bottom to top)
        outerPts.forEach(p => profile.push(p.clone()));

        // Rim: connect outer top to inner top (small lip)
        const outerTop = outerPts[outerPts.length - 1];
        const innerTop = innerPts[innerPts.length - 1];
        profile.push(new THREE.Vector2(outerTop.x, outerTop.y));
        profile.push(new THREE.Vector2(innerTop.x, innerTop.y));

        // Inner wall (top to bottom, reversed)
        for (let i = innerPts.length - 1; i >= 0; i--) {
          profile.push(innerPts[i].clone());
        }

        // Inner bottom center (close the bottom from inside)
        profile.push(new THREE.Vector2(0, innerPts[0].y));

        const geom = new THREE.LatheGeometry(profile, LATHE_SEGMENTS);

        // ── Improved UV mapping: proper cylindrical mapping for both vases ──
        const outerWallStart = 1; // index after bottom center
        const outerWallEnd = outerWallStart + outerPts.length - 1;
        const profileLen = profile.length;
        const minY = outerPts[0].y;
        const maxY = outerPts[outerPts.length - 1].y;
        const yRange = maxY - minY;

        const uv = geom.attributes.uv;
        const pos = geom.attributes.position;

        // Calculate cumulative arc length for better V mapping
        const arcLengths = [0];
        for (let i = 1; i < outerPts.length; i++) {
          const dx = outerPts[i].x - outerPts[i - 1].x;
          const dy = outerPts[i].y - outerPts[i - 1].y;
          arcLengths.push(arcLengths[i - 1] + Math.sqrt(dx * dx + dy * dy));
        }
        const totalArcLength = arcLengths[arcLengths.length - 1];

        for (let seg = 0; seg <= LATHE_SEGMENTS; seg++) {
          // U coordinate: normalized angle (0 to 1 around the circle)
          const u = seg / LATHE_SEGMENTS;

          for (let pt = 0; pt < profileLen; pt++) {
            const idx = seg * profileLen + pt;

            // Set U coordinate for all points
            uv.setX(idx, u);

            if (pt >= outerWallStart && pt <= outerWallEnd) {
              // Outer wall: map V using arc length for uniform texture distribution
              const outerPtIdx = pt - outerWallStart;
              const v = arcLengths[outerPtIdx] / totalArcLength;
              uv.setY(idx, v);
            } else if (pt === 0) {
              // Bottom center: V=0
              uv.setY(idx, 0);
            } else {
              // Inner wall, rim, inner bottom: mirror the outer wall mapping
              const innerIdx = profileLen - 1 - pt;
              if (innerIdx >= outerWallStart && innerIdx <= outerWallEnd) {
                const outerPtIdx = innerIdx - outerWallStart;
                const v = arcLengths[outerPtIdx] / totalArcLength;
                uv.setY(idx, v);
              } else {
                uv.setY(idx, pt > outerWallEnd ? 1.0 : 0.0);
              }
            }
          }
        }
        uv.needsUpdate = true;

        return geom;
      }

      let currentVaseShape = 'vaseA';
      let geometry = createSolidVaseGeometry(potteryShapes.vaseA);

      const canvasTexture = new THREE.CanvasTexture(texCanvas);
      canvasTexture.colorSpace = THREE.SRGBColorSpace;
      const dispTexture = new THREE.CanvasTexture(dispCanvas);
      const normalTexture = new THREE.CanvasTexture(normalCanvas);

      function buildHeightMap() {
        const src = texCtx.getImageData(0, 0, TEX_W, TEX_H);
        const dst = dispCtx.createImageData(TEX_W, TEX_H);
        for (let i = 0; i < src.data.length; i += 4) {
          const lum = src.data[i] * 0.299 + src.data[i + 1] * 0.587 + src.data[i + 2] * 0.114;
          const inv = 255 - lum;
          dst.data[i] = inv; dst.data[i + 1] = inv; dst.data[i + 2] = inv; dst.data[i + 3] = 255;
        }
        dispCtx.putImageData(dst, 0, 0);
        dispTexture.needsUpdate = true;
      }

      function buildNormalMap() {
        const src = texCtx.getImageData(0, 0, TEX_W, TEX_H);
        const dst = normalCtx.createImageData(TEX_W, TEX_H);
        const strength = 2.0;
        for (let y = 0; y < TEX_H; y++) {
          for (let x = 0; x < TEX_W; x++) {
            const i = (y * TEX_W + x) * 4;
            const getHeight = (px, py) => {
              px = Math.max(0, Math.min(TEX_W - 1, px));
              py = Math.max(0, Math.min(TEX_H - 1, py));
              const idx = (py * TEX_W + px) * 4;
              return (src.data[idx] * 0.299 + src.data[idx + 1] * 0.587 + src.data[idx + 2] * 0.114) / 255;
            };
            const left = getHeight(x - 1, y), right = getHeight(x + 1, y);
            const up = getHeight(x, y - 1), down = getHeight(x, y + 1);
            const dx = (left - right) * strength, dy = (up - down) * strength, dz = 1.0;
            const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
            dst.data[i] = Math.floor((dx / len * 0.5 + 0.5) * 255);
            dst.data[i + 1] = Math.floor((dy / len * 0.5 + 0.5) * 255);
            dst.data[i + 2] = Math.floor((dz / len * 0.5 + 0.5) * 255);
            dst.data[i + 3] = 255;
          }
        }
        normalCtx.putImageData(dst, 0, 0);
        normalTexture.needsUpdate = true;
      }

      // Professional ceramic/metallic materials
      const matDisplacement = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.25,
        metalness: 0.1,
        map: canvasTexture,
        displacementMap: dispTexture,
        displacementScale: 0.12,
        envMapIntensity: 0.5,
        side: THREE.DoubleSide
      });

      const matParallax = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.3,
        metalness: 0.05,
        map: canvasTexture,
        bumpMap: dispTexture,
        bumpScale: 0.6,
        side: THREE.DoubleSide
      });

      const matBump = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.35,
        metalness: 0.08,
        map: canvasTexture,
        normalMap: normalTexture,
        normalScale: new THREE.Vector2(1.2, 1.2),
        side: THREE.DoubleSide
      });

      // ── Vase effect uniforms (applied directly to vase material) ──
      const vaseEffectUniforms = {
        uTime: { value: 0 },
        uMelt: { value: 0 }, uTiltshift: { value: 0 },
        uBadtv: { value: 0 }, uEdge: { value: 0 },
        uSlices: { value: 0 }, uVignette: { value: 0 },
        uWobble: { value: 0 }, uPolar: { value: 0 },
        uSmear: { value: 0 }, uDot: { value: 0 }
      };

      function applyVaseEffects(material) {
        material.onBeforeCompile = (shader) => {
          Object.entries(vaseEffectUniforms).forEach(([key, uniform]) => {
            shader.uniforms[key] = uniform;
          });

          // ── Vertex shader: mesh deformation (wobble + melt) ──
          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uWobble;
            uniform float uMelt;
            `
          );
          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            if (uWobble > 0.01) {
              float wAmt = uWobble * 0.15;
              transformed.x += wAmt * sin(transformed.y * 8.0 + uTime * 2.5);
              transformed.z += wAmt * cos(transformed.y * 6.0 + uTime * 1.8);
            }
            if (uMelt > 0.01) {
              float mAmt = uMelt * 0.1;
              float meltFactor = smoothstep(0.0, 3.5, transformed.y);
              transformed.x *= 1.0 + mAmt * meltFactor * sin(uTime * 1.2 + transformed.y * 3.0);
              transformed.z *= 1.0 + mAmt * meltFactor * cos(uTime * 0.8 + transformed.y * 2.0);
              transformed.y -= mAmt * meltFactor * meltFactor * 0.5;
            }
            `
          );

          // ── Fragment shader: texture effects on vase surface ──
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uMelt, uTiltshift, uBadtv, uEdge;
            uniform float uSlices, uVignette, uWobble, uPolar, uSmear, uDot;
            float vaseHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
            `
          );

          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <map_fragment>',
            `
            #ifdef USE_MAP
            vec2 mapUv = vMapUv;

            if (uWobble > 0.01) {
              float w = uWobble * 0.04;
              mapUv.x += w * sin(mapUv.y * 18.0 + uTime * 2.5);
              mapUv.y += w * cos(mapUv.x * 18.0 + uTime * 1.8);
            }
            if (uMelt > 0.01) {
              float m = uMelt * 0.05;
              mapUv.y += m * sin(mapUv.x * 12.0 + uTime * 1.2) * sin(mapUv.y * 6.0 + uTime * 0.8);
              mapUv.x += m * 0.5 * cos(mapUv.y * 10.0 + uTime * 2.0);
            }
            if (uBadtv > 0.01) {
              float n = vaseHash(vec2(floor(mapUv.y * 80.0), floor(uTime * 15.0)));
              float jitter = (n - 0.5) * uBadtv * 0.08;
              float band = step(0.97 - uBadtv * 0.05, vaseHash(vec2(floor(mapUv.y * 30.0), floor(uTime * 8.0))));
              mapUv.x += jitter + band * (n - 0.5) * uBadtv * 0.15;
            }
            if (uSlices > 0.01) {
              float si = floor(mapUv.y * 25.0);
              float off = sin(si * 4.3 + uTime * 0.8) * uSlices * 0.06;
              mapUv.x += off * step(0.4, vaseHash(vec2(si, 1.0)));
            }

            vec4 sampledDiffuseColor;
            if (uSmear > 0.01) {
              vec4 smearSum = vec4(0.0);
              float sd = uSmear * 0.025;
              for (float i = 0.0; i < 10.0; i++) {
                smearSum += texture2D(map, mapUv - vec2(sd * i / 10.0, sd * i / 10.0 * 0.3));
              }
              sampledDiffuseColor = smearSum / 10.0;
            } else {
              sampledDiffuseColor = texture2D(map, mapUv);
            }

            if (uBadtv > 0.01) {
              float sp = uBadtv * 0.012;
              sampledDiffuseColor.r = texture2D(map, mapUv + vec2(sp, 0.0)).r;
              sampledDiffuseColor.b = texture2D(map, mapUv - vec2(sp, 0.0)).b;
            }
            if (uTiltshift > 0.01) {
              float bz = smoothstep(0.15, 0.9, abs(mapUv.y - 0.5) * 2.0) * uTiltshift;
              if (bz > 0.01) {
                vec4 bl = vec4(0.0);
                for (float i = -4.0; i <= 4.0; i++) bl += texture2D(map, mapUv + vec2(0.0, i * 0.005 * bz));
                sampledDiffuseColor = mix(sampledDiffuseColor, bl / 9.0, bz * 0.8);
              }
            }
            if (uEdge > 0.01) {
              float e = 1.0 / 480.0;
              vec3 etl = texture2D(map, mapUv + vec2(-e, -e)).rgb;
              vec3 etr = texture2D(map, mapUv + vec2(e, -e)).rgb;
              vec3 ebl = texture2D(map, mapUv + vec2(-e, e)).rgb;
              vec3 ebr = texture2D(map, mapUv + vec2(e, e)).rgb;
              vec3 gx = -etl + etr - ebl + ebr;
              vec3 gy = -etl - etr + ebl + ebr;
              sampledDiffuseColor.rgb += sqrt(gx * gx + gy * gy) * uEdge * 2.0;
            }
            if (uBadtv > 0.01) {
              float sc = sin(mapUv.y * 480.0 * 3.14159) * 0.5 + 0.5;
              sampledDiffuseColor.rgb *= 1.0 - uBadtv * 0.25 * (1.0 - sc);
            }
            if (uVignette > 0.01) {
              float d = length(mapUv - 0.5) * 1.6;
              sampledDiffuseColor.rgb *= 1.0 - smoothstep(0.2, 1.3, d) * uVignette * 0.85;
            }
            if (uPolar > 0.01) {
              vec2 c = mapUv - 0.5;
              float ang = atan(c.y, c.x), rad = length(c);
              float ps = uPolar * 0.12 + 0.005;
              vec2 pu = vec2(cos(floor(ang / ps) * ps), sin(floor(ang / ps) * ps)) * floor(rad / ps) * ps + 0.5;
              sampledDiffuseColor = mix(sampledDiffuseColor, texture2D(map, pu), uPolar * 0.65);
            }
            if (uDot > 0.01) {
              float ds = mix(3.0, 14.0, uDot);
              vec2 cc = (floor(mapUv * 480.0 / ds) + 0.5) * ds / 480.0;
              vec4 dc = texture2D(map, cc);
              float lm = dot(dc.rgb, vec3(0.299, 0.587, 0.114));
              float dd = length(fract(mapUv * 480.0 / ds) - 0.5);
              float dm = 1.0 - smoothstep(lm * 0.45, lm * 0.45 + 0.05, dd);
              sampledDiffuseColor = mix(sampledDiffuseColor, vec4(dc.rgb * dm, 1.0), uDot * 0.55);
            }

            diffuseColor *= sampledDiffuseColor;
            #endif
            `
          );
        };
        material.customProgramCacheKey = () => 'vaseEffects_' + material.uuid;
        material.needsUpdate = true;
      }

      applyVaseEffects(matDisplacement);
      applyVaseEffects(matParallax);
      applyVaseEffects(matBump);

      let currentMode = 'bump'; // Default to Bump/Normal
      let vase = new THREE.Mesh(geometry, matBump);
      vase.position.y = 0;
      scene.add(vase);

      // ── Bottom disc: shows canvas sketch on the underside of the vase ──
      const bottomDiscTexture = new THREE.CanvasTexture(texCanvas);
      bottomDiscTexture.colorSpace = THREE.SRGBColorSpace;
      const bottomDiscMaterial = new THREE.MeshStandardMaterial({
        map: bottomDiscTexture,
        roughness: 0.4,
        metalness: 0.05,
        side: THREE.DoubleSide
      });

      function getBottomRadius(shapeData) {
        const maxH = shapeData[shapeData.length - 1].h;
        const scale = 3.5 / maxH;
        return shapeData[0].r * scale;
      }

      let bottomDiscGeom = new THREE.CircleGeometry(getBottomRadius(potteryShapes[currentVaseShape]), 64);
      let bottomDisc = new THREE.Mesh(bottomDiscGeom, bottomDiscMaterial);
      bottomDisc.rotation.x = -Math.PI / 2; // Face downward
      bottomDisc.position.y = 0.01; // Slightly above y=0 to avoid z-fighting
      scene.add(bottomDisc);

      // Function to switch vase shape
      function setVaseShape(shape) {
        if (!potteryShapes[shape] || shape === currentVaseShape) return;
        currentVaseShape = shape;

        // Remove old vase and disc
        scene.remove(vase);
        scene.remove(bottomDisc);
        geometry.dispose();
        bottomDiscGeom.dispose();

        // Create new geometry from JSON data
        geometry = createSolidVaseGeometry(potteryShapes[shape]);

        // Create new mesh with current material
        let currentMaterial;
        if (currentMode === 'displacement') currentMaterial = matDisplacement;
        else if (currentMode === 'parallax') currentMaterial = matParallax;
        else currentMaterial = matBump;

        vase = new THREE.Mesh(geometry, currentMaterial);
        vase.position.y = 0;
        scene.add(vase);

        // Recreate bottom disc with new radius
        bottomDiscGeom = new THREE.CircleGeometry(getBottomRadius(potteryShapes[shape]), 64);
        bottomDisc = new THREE.Mesh(bottomDiscGeom, bottomDiscMaterial);
        bottomDisc.rotation.x = -Math.PI / 2;
        bottomDisc.position.y = 0.01;
        scene.add(bottomDisc);
      }

      // Grid
      let grid = new THREE.GridHelper(8, 20,
        isDarkMode ? THEME.dark.gridMain : THEME.light.gridMain,
        isDarkMode ? THEME.dark.gridSub : THEME.light.gridSub
      );
      scene.add(grid);

      // Theme toggle
      const themeToggleBtn = document.getElementById('theme-toggle');
      if (!isDarkMode) container.classList.add('light-mode');
      updateThemeButton();

      function updateThemeButton() {
        themeToggleBtn.innerHTML = isDarkMode
          ? '<span class="theme-icon">☀️</span> Light'
          : '<span class="theme-icon">🌙</span> Dark';
      }

      function applyTheme() {
        const theme = isDarkMode ? THEME.dark : THEME.light;

        // Scene background
        scene.background.setHex(theme.background);

        // Recreate grid with new colors
        scene.remove(grid);
        grid = new THREE.GridHelper(8, 20, theme.gridMain, theme.gridSub);
        scene.add(grid);

        // Save preference
        localStorage.setItem('viewerTheme', isDarkMode ? 'dark' : 'light');

        // Update UI
        if (isDarkMode) {
          container.classList.remove('light-mode');
        } else {
          container.classList.add('light-mode');
        }
        updateThemeButton();
      }

      themeToggleBtn.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        applyTheme();
      });

      function setMode(mode) {
        currentMode = mode;
        if (mode === 'displacement') vase.material = matDisplacement;
        else if (mode === 'parallax') vase.material = matParallax;
        else vase.material = matBump;
      }

      // ══════════════════════════════════════
      //  Particle System
      // ══════════════════════════════════════
      const particleCount = 200;
      const particleGeometry = new THREE.BufferGeometry();
      const particlePositions = new Float32Array(particleCount * 3);
      const particleVelocities = [];
      const particleColors = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount; i++) {
        particlePositions[i * 3] = (Math.random() - 0.5) * 10;
        particlePositions[i * 3 + 1] = Math.random() * 6;
        particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
        particleVelocities.push({
          x: (Math.random() - 0.5) * 0.01,
          y: (Math.random() - 0.5) * 0.01,
          z: (Math.random() - 0.5) * 0.01
        });
        particleColors[i * 3] = 1;
        particleColors[i * 3 + 1] = 1;
        particleColors[i * 3 + 2] = 1;
      }

      particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const particleMaterial = new THREE.PointsMaterial({
        size: 0.05,
        vertexColors: true,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
      });

      const particles = new THREE.Points(particleGeometry, particleMaterial);
      scene.add(particles);

      // Current emotion state
      let dominantEmotion = 'joy';
      let emotionIntensity = 0;
      let targetColor = { r: 1, g: 1, b: 1 };
      let currentColor = { r: 1, g: 1, b: 1 };
      let particleSpeed = 1;


      // ══════════════════════════════════════
      //  Cinematic Camera (Always Active)
      // ══════════════════════════════════════
      let cameraAngle = 0;
      let cameraZoom = 0;

      function onActivity() {
        // Activity tracking (for future use if needed)
      }

      socket.on('draw', (data) => {
        onActivity();
        const dataURL = typeof data === 'string' ? data : data.dataURL;
        const mode = typeof data === 'object' && data.mode ? data.mode : currentMode;
        const vaseShape = typeof data === 'object' && data.vaseShape ? data.vaseShape : 'vaseA';
        const img = new Image();
        img.onload = () => {
          texCtx.clearRect(0, 0, TEX_W, TEX_H);
          texCtx.drawImage(img, 0, 0, TEX_W, TEX_H);
          canvasTexture.needsUpdate = true;
          bottomDiscTexture.needsUpdate = true;
          buildHeightMap();
          buildNormalMap();
          setMode(mode);
          setVaseShape(vaseShape);
        };
        img.src = dataURL;
      });

      socket.on('vaseShape', (shape) => {
        onActivity();
        setVaseShape(shape);
      });

      socket.on('emotion', (data) => {
        onActivity();
        vaseEffectUniforms.uMelt.value = data.melt || 0;
        vaseEffectUniforms.uTiltshift.value = data.tiltshift || 0;
        vaseEffectUniforms.uBadtv.value = data.badtv || 0;
        vaseEffectUniforms.uEdge.value = data.edge || 0;
        vaseEffectUniforms.uSlices.value = data.slices || 0;
        vaseEffectUniforms.uVignette.value = data.vignette || 0;
        vaseEffectUniforms.uWobble.value = data.wobble || 0;
        vaseEffectUniforms.uPolar.value = data.polar || 0;
        vaseEffectUniforms.uSmear.value = data.smear || 0;
        vaseEffectUniforms.uDot.value = data.dot || 0;

        // Find dominant emotion
        const emotionSums = {
          joy: (data.melt || 0) + (data.tiltshift || 0),
          shock: (data.badtv || 0) + (data.edge || 0),
          sad: (data.slices || 0) + (data.vignette || 0),
          confuse: (data.wobble || 0) + (data.polar || 0),
          fire: (data.smear || 0) + (data.dot || 0)
        };

        let maxEmotion = 'joy', maxVal = 0;
        Object.entries(emotionSums).forEach(([emo, val]) => {
          if (val > maxVal) { maxVal = val; maxEmotion = emo; }
        });

        dominantEmotion = maxEmotion;
        emotionIntensity = Math.min(maxVal, 1);
        targetColor = EMOTION_COLORS[dominantEmotion];
        particleSpeed = 0.5 + emotionIntensity * 2;
      });

      function animate() {
        requestAnimationFrame(animate);
        const time = performance.now() * 0.001;
        vaseEffectUniforms.uTime.value = time;

        // Vase rotation
        vase.rotation.y += 0.004;

        // Cinematic camera orbit (always active)
        cameraAngle += 0.003;
        cameraZoom = Math.sin(time * 0.2) * 0.6; // Reduced zoom range
        const radius = 7 + cameraZoom; // Increased base distance
        camera.position.x = Math.sin(cameraAngle) * radius;
        camera.position.z = Math.cos(cameraAngle) * radius;
        camera.position.y = 2.5 + Math.sin(time * 0.15) * 0.3;
        camera.lookAt(0, 1.5, 0);

        // Dynamic lighting
        currentColor.r += (targetColor.r - currentColor.r) * 0.02;
        currentColor.g += (targetColor.g - currentColor.g) * 0.02;
        currentColor.b += (targetColor.b - currentColor.b) * 0.02;

        // Ambient light tint (theme-aware)
        const ambBase = isDarkMode ? THEME.dark.ambientBase : THEME.light.ambientBase;
        const ambBoost = isDarkMode ? 0.3 : 0.2;
        ambientLight.color.setRGB(
          ambBase + currentColor.r * ambBoost * emotionIntensity,
          ambBase + currentColor.g * ambBoost * emotionIntensity,
          ambBase + currentColor.b * ambBoost * emotionIntensity
        );

        // Pulsing point lights
        pointLights.forEach((pl, i) => {
          const pulse = Math.sin(time * 2 + pl.phase) * 0.5 + 0.5;
          pl.light.intensity = emotionIntensity * pulse * 1.5;
          pl.light.color.setRGB(currentColor.r, currentColor.g, currentColor.b);
        });

        // Particle animation
        const positions = particleGeometry.attributes.position.array;
        const colors = particleGeometry.attributes.color.array;
        for (let i = 0; i < particleCount; i++) {
          const vel = particleVelocities[i];
          positions[i * 3] += vel.x * particleSpeed;
          positions[i * 3 + 1] += vel.y * particleSpeed;
          positions[i * 3 + 2] += vel.z * particleSpeed;

          // Wrap around
          if (positions[i * 3] > 5) positions[i * 3] = -5;
          if (positions[i * 3] < -5) positions[i * 3] = 5;
          if (positions[i * 3 + 1] > 6) positions[i * 3 + 1] = 0;
          if (positions[i * 3 + 1] < 0) positions[i * 3 + 1] = 6;
          if (positions[i * 3 + 2] > 5) positions[i * 3 + 2] = -5;
          if (positions[i * 3 + 2] < -5) positions[i * 3 + 2] = 5;

          // Color (theme-aware)
          const colorBase = isDarkMode ? 0.5 : 0.3;
          const colorMix = isDarkMode ? 0.5 : 0.7;
          colors[i * 3] = colorBase + currentColor.r * colorMix;
          colors[i * 3 + 1] = colorBase + currentColor.g * colorMix;
          colors[i * 3 + 2] = colorBase + currentColor.b * colorMix;
        }
        particleGeometry.attributes.position.needsUpdate = true;
        particleGeometry.attributes.color.needsUpdate = true;

        // Update bottom disc texture from canvas
        if (bottomDiscTexture) bottomDiscTexture.needsUpdate = true;

        // Render
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight - 44;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      // ══════════════════════════════════════
      //  Firing Sequence (Viewer)
      //  壺を赤く熱して焼き上げ → 冷却 → 360度キャプチャ → Firestore保存
      // ══════════════════════════════════════
      let isFiring = false;
      let firingStartTime = 0;
      const FIRING_HEAT_DURATION = 3000;  // 3s heating
      const FIRING_COOL_DURATION = 3000;  // 3s cooling
      const FIRING_TOTAL = FIRING_HEAT_DURATION + FIRING_COOL_DURATION;

      // Emissive control for firing
      const originalEmissive = new THREE.Color(0x000000);

      function startFiringAnimation(saveData) {
        isFiring = true;
        firingStartTime = performance.now();

        // Show firing overlay
        const overlay = document.getElementById('firing-overlay');
        overlay.classList.add('active');
        document.getElementById('firing-text').textContent = '焼き上げ中...';
        document.getElementById('firing-sub').textContent = '壺を窯で焼いています';

        // Start capture frames for thumbnail
        const capturedFrames = [];

        // ── Video Recording (MediaRecorder on WebGL canvas) ──
        let mediaRecorder = null;
        let videoChunks = [];
        let videoDataUrl = null;

        try {
          const canvasStream = renderer.domElement.captureStream(30); // 30fps
          mediaRecorder = new MediaRecorder(canvasStream, {
            mimeType: 'video/webm;codecs=vp9',
            videoBitsPerSecond: 2500000
          });
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) videoChunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            const blob = new Blob(videoChunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              videoDataUrl = reader.result;
              console.log('Video recording complete, size:', blob.size);
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          console.log('Video recording started');
        } catch (e) {
          console.warn('MediaRecorder not available, skipping video:', e);
        }

        // 360度回転キャプチャ用: 焼き上げ中に高速回転
        function firingTick() {
          if (!isFiring) return;
          const elapsed = performance.now() - firingStartTime;
          const progress = Math.min(elapsed / FIRING_TOTAL, 1);

          // Phase 1: Heating (0 - 3s)
          if (elapsed < FIRING_HEAT_DURATION) {
            const heatProgress = elapsed / FIRING_HEAT_DURATION;
            const heatIntensity = Math.sin(heatProgress * Math.PI) * 0.8 + heatProgress * 0.6;

            [matDisplacement, matParallax, matBump].forEach(mat => {
              mat.emissive = new THREE.Color(heatIntensity * 0.8, heatIntensity * 0.15, 0);
              mat.emissiveIntensity = heatIntensity * 2;
            });

            vase.rotation.y += 0.03;

            if (heatProgress > 0.5) {
              document.getElementById('firing-text').textContent = '焼成中';
            }
          }
          // Phase 2: Cooling (3s - 6s)
          else {
            const coolProgress = (elapsed - FIRING_HEAT_DURATION) / FIRING_COOL_DURATION;
            const coolIntensity = (1 - coolProgress) * 1.4;

            [matDisplacement, matParallax, matBump].forEach(mat => {
              mat.emissive = new THREE.Color(coolIntensity * 0.5, coolIntensity * 0.08, coolIntensity * 0.02);
              mat.emissiveIntensity = coolIntensity;
            });

            vase.rotation.y += 0.02 * (1 - coolProgress) + 0.004;

            document.getElementById('firing-text').textContent = '冷却中...';
            document.getElementById('firing-sub').textContent = '色が定着しています';
          }

          // Capture frames for thumbnail
          if (elapsed > FIRING_HEAT_DURATION && capturedFrames.length < 36) {
            renderer.setRenderTarget(null);
            renderer.render(scene, camera);
            capturedFrames.push(renderer.domElement.toDataURL('image/jpeg', 0.7));
          }

          if (progress >= 1) {
            isFiring = false;
            [matDisplacement, matParallax, matBump].forEach(mat => {
              mat.emissive = originalEmissive.clone();
              mat.emissiveIntensity = 1;
            });

            overlay.classList.remove('active');

            // Stop video recording
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
              mediaRecorder.stop();
            }

            const thumbnailData = capturedFrames.length > 0
              ? capturedFrames[Math.floor(capturedFrames.length / 2)]
              : renderer.domElement.toDataURL('image/jpeg', 0.7);

            // Wait briefly for video to finalize, then save
            setTimeout(() => {
              saveToFirestore(saveData, thumbnailData, videoDataUrl);
            }, 500);
            return;
          }

          requestAnimationFrame(firingTick);
        }

        requestAnimationFrame(firingTick);
      }

      async function saveToFirestore(saveData, thumbnailData, videoDataUrl) {
        const workId = 'work_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const signatureData = saveData.signatureData || null;

        if (db && firebaseReady) {
          try {
            let thumbnailUrl = thumbnailData;
            if (storage) {
              try {
                const thumbRef = storage.ref(`${GALLERY_PATH}/${workId}/thumbnail.jpg`);
                await thumbRef.putString(thumbnailData, 'data_url');
                thumbnailUrl = await thumbRef.getDownloadURL();
              } catch (e) {
                console.warn('Storage upload failed, using base64:', e);
              }

              // Upload video to Storage if available
              if (videoDataUrl && storage) {
                try {
                  const videoRef = storage.ref(`${GALLERY_PATH}/${workId}/video.webm`);
                  await videoRef.putString(videoDataUrl, 'data_url');
                  const videoUrl = await videoRef.getDownloadURL();
                  console.log('Video uploaded to Storage:', videoUrl);
                } catch (e) {
                  console.warn('Video upload failed:', e);
                }
              }
            }

            await db.collection(GALLERY_PATH).doc(workId).set({
              displacementData: saveData.displacementData,
              effectValues: saveData.effectValues,
              vaseShape: saveData.vaseShape,
              timestamp: firebase.firestore.FieldValue.serverTimestamp(),
              thumbnailUrl: thumbnailUrl,
              mode: saveData.mode,
              signatureData: signatureData
            });

            console.log('Saved to Firestore:', workId);
            updateGlobalMood();
          } catch (e) {
            console.error('Firestore save error:', e);
          }
        } else {
          console.warn('Firebase not configured, using server API only');
        }

        // Always save to server API
        try {
          await fetch('/api/works/' + workId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              displacementData: saveData.displacementData,
              effectValues: saveData.effectValues,
              vaseShape: saveData.vaseShape,
              mode: saveData.mode,
              thumbnailUrl: thumbnailData,
              signatureData: signatureData
            })
          });
          console.log('Saved to server API:', workId);
        } catch (e) {
          console.error('Server API save error:', e);
        }

        socket.emit('saveComplete', { workId, thumbnailUrl: thumbnailData });
      }

      // Listen for save event from controller
      socket.on('save', (data) => {
        if (!isFiring) {
          startFiringAnimation(data);
        }
      });

      // ══════════════════════════════════════
      //  Gallery Mode (Viewer)
      // ══════════════════════════════════════
      let galleryActive = false;

      async function loadGalleryWorks() {
        if (!db || !firebaseReady) return [];
        try {
          const snapshot = await db.collection(GALLERY_PATH)
            .orderBy('timestamp', 'desc')
            .limit(50)
            .get();
          return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } catch (e) {
          console.error('Gallery load error:', e);
          return [];
        }
      }

      async function enterGalleryMode() {
        if (galleryActive) return;
        galleryActive = true;

        const overlay = document.getElementById('gallery-overlay');
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';

        const works = await loadGalleryWorks();

        if (works.length === 0) {
          grid.innerHTML = '<div style="color:#666;text-align:center;grid-column:1/-1;padding:60px;font-size:18px;">まだ作品がありません</div>';
        } else {
          works.forEach(work => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            const img = document.createElement('img');
            img.src = work.thumbnailUrl || '';
            img.alt = work.id;
            img.loading = 'lazy';
            item.appendChild(img);
            item.addEventListener('click', () => {
              // Load this work into the viewer
              exitGalleryMode();
              loadWorkIntoViewer(work);
            });
            grid.appendChild(item);
          });
        }

        overlay.classList.add('active');
      }

      function exitGalleryMode() {
        if (!galleryActive) return;
        galleryActive = false;
        document.getElementById('gallery-overlay').classList.remove('active');
      }

      function loadWorkIntoViewer(work) {
        // Restore vase shape
        if (work.vaseShape) setVaseShape(work.vaseShape);

        // Restore canvas texture
        if (work.displacementData) {
          const img = new Image();
          img.onload = () => {
            texCtx.clearRect(0, 0, TEX_W, TEX_H);
            texCtx.drawImage(img, 0, 0, TEX_W, TEX_H);
            canvasTexture.needsUpdate = true;
            buildHeightMap();
            buildNormalMap();
            if (work.mode) setMode(work.mode);
          };
          img.src = work.displacementData;
        }

        // Restore effects
        if (work.effectValues) {
          const data = work.effectValues;
          vaseEffectUniforms.uMelt.value = data.melt || 0;
          vaseEffectUniforms.uTiltshift.value = data.tiltshift || 0;
          vaseEffectUniforms.uBadtv.value = data.badtv || 0;
          vaseEffectUniforms.uEdge.value = data.edge || 0;
          vaseEffectUniforms.uSlices.value = data.slices || 0;
          vaseEffectUniforms.uVignette.value = data.vignette || 0;
          vaseEffectUniforms.uWobble.value = data.wobble || 0;
          vaseEffectUniforms.uPolar.value = data.polar || 0;
          vaseEffectUniforms.uSmear.value = data.smear || 0;
          vaseEffectUniforms.uDot.value = data.dot || 0;
        }
      }

      socket.on('enterGallery', () => enterGalleryMode());
      socket.on('exitGallery', () => exitGalleryMode());
      socket.on('loadWork', (data) => loadWorkIntoViewer(data));

      // ══════════════════════════════════════
      //  Global Mood (感情の集積)
      // ══════════════════════════════════════
      let globalMoodData = {};

      async function updateGlobalMood() {
        if (!db || !firebaseReady) return;
        try {
          const snapshot = await db.collection(GALLERY_PATH).get();
          const totals = { melt: 0, tiltshift: 0, badtv: 0, edge: 0, slices: 0, vignette: 0, wobble: 0, polar: 0, smear: 0, dot: 0 };
          let count = 0;

          snapshot.forEach(doc => {
            const d = doc.data();
            if (d.effectValues) {
              Object.keys(totals).forEach(k => {
                totals[k] += (d.effectValues[k] || 0);
              });
              count++;
            }
          });

          if (count > 0) {
            Object.keys(totals).forEach(k => totals[k] /= count);
          }

          globalMoodData = totals;
          socket.emit('updateGlobalMood', totals);
          applyGlobalMood(totals);
        } catch (e) {
          console.error('Global mood calculation error:', e);
        }
      }

      function applyGlobalMood(mood) {
        // Determine dominant emotion from global averages
        const emotionSums = {
          joy: (mood.melt || 0) + (mood.tiltshift || 0),
          shock: (mood.badtv || 0) + (mood.edge || 0),
          sad: (mood.slices || 0) + (mood.vignette || 0),
          confuse: (mood.wobble || 0) + (mood.polar || 0),
          fire: (mood.smear || 0) + (mood.dot || 0)
        };

        let maxEmo = 'joy', maxVal = 0;
        Object.entries(emotionSums).forEach(([emo, val]) => {
          if (val > maxVal) { maxVal = val; maxEmo = emo; }
        });

        const intensity = Math.min(maxVal, 0.5);
        particleMaterial.opacity = 0.6 + intensity * 0.2;
      }

      socket.on('globalMood', (data) => {
        globalMoodData = data;
        applyGlobalMood(data);
      });

      // Initial global mood load
      if (db && firebaseReady) {
        setTimeout(updateGlobalMood, 3000);
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  AR VIEWER (for ?workId=XXX on mobile)
    // ══════════════════════════════════════════════════════════════
    if (role === 'arViewer') {
      document.getElementById('ar-viewer-ui').style.display = 'flex';
      document.body.style.overflow = 'auto';
      document.body.style.height = 'auto';

      // 作品データを取得
      async function loadWork() {
        let work = null;
        try {
          const res = await fetch('/api/works/' + workId);
          if (res.ok) work = await res.json();
        } catch(e) { console.warn('Server API load failed:', e); }
        if (!work && db && firebaseReady) {
          try {
            const doc = await db.collection(GALLERY_PATH).doc(workId).get();
            if (doc.exists) work = { id: doc.id, ...doc.data() };
          } catch(e) { console.warn('Firestore load failed:', e); }
        }
        return work;
      }

      // シェアページ初期化
      async function initSharePage() {
        const msgEl = document.getElementById('share-message');
        msgEl.textContent = '読み込み中...';

        const work = await loadWork();
        if (!work) {
          msgEl.textContent = '作品が見つかりませんでした';
          return;
        }
        msgEl.textContent = '';

        // サムネイル表示
        const previewEl = document.getElementById('share-preview');
        if (work.thumbnailUrl || work.displacementData) {
          const img = document.createElement('img');
          img.src = work.thumbnailUrl || work.displacementData;
          img.style.maxWidth = '100%';
          img.style.borderRadius = '12px';
          previewEl.appendChild(img);
        }

        // 感情バー
        if (work.effectValues) {
          renderEmotionBar(
            document.getElementById('share-emotion-bar'),
            document.getElementById('share-emotion-labels'),
            calcEmotionFromEffects(work.effectValues)
          );
        }

        // Instagram共有ボタン
        document.getElementById('share-instagram-btn').addEventListener('click', () => {
          const imgUrl = work.thumbnailUrl || work.displacementData;
          // Instagram Stories deep link (モバイル)
          window.location.href = 'instagram-stories://share?background_image=' + encodeURIComponent(imgUrl);
          // フォールバック: Web Share API
          setTimeout(() => {
            if (navigator.share) {
              navigator.share({ title: 'Emotion Paint', url: location.href }).catch(() => {});
            }
          }, 2000);
        });

        // 画像保存ボタン
        document.getElementById('share-download-btn').addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = work.thumbnailUrl || work.displacementData;
          a.download = 'emotion-paint-' + workId + '.png';
          a.click();
        });
      }

      initSharePage();
    }
  </script>
